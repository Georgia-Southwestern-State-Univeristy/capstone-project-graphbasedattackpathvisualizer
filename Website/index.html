<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph-Based Attack Visualizer</title>

  <style>
    /* Slide in from top and fade in */
    @keyframes slideIn {
      0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Subtle glowing border pulse */
    @keyframes borderPulse {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); border-color: rgba(244, 63, 94, 0.4); }
      50% { box-shadow: 0 0 15px 2px rgba(244, 63, 94, 0.2); border-color: rgba(244, 63, 94, 0.7); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); border-color: rgba(244, 63, 94, 0.4); }
    }

    .animate-in {
      animation: slideIn 0.4s ease-out forwards;
    }

    .pulse-red {
      animation: borderPulse 2s infinite ease-in-out;
    }
    
  </style>
</head>

<body class="h-screen bg-slate-900 text-slate-200 overflow-hidden text-[11px]">
  <div class="flex h-full">

    <!-- Left side bar -->
    <aside class="w-52 bg-slate-800 border-r border-slate-700 p-4 flex flex-col shrink-0">
      <h2 class="text-lg font-semibold mb-6 text-white uppercase tracking-wider">Mitigations</h2>
      
      <!--Scrollable section-->
      <div class="flex-1 min-h-0 overflow-y-auto pr-2 space-y-6 sidebar-scroll">
         
        <div id="mitigationContainer"
            class="flex-1 min-h-0 overflow-y-auto pr-2 space-y-6 sidebar-scroll pb-5">
        </div>
        
        </div>
        
      
      
      <div class="space-y-2 pt-4 border-t border-slate-700">
        <button id="computeBtn" class="w-full bg-blue-600 hover:bg-blue-700 transition py-2 rounded-lg font-bold uppercase tracking-tighter">Compute Path</button>
        <button id="clearPathBtn" class="w-full bg-slate-600 hover:bg-slate-700 transition py-2 rounded-lg font-medium text-slate-300">Clear</button>
      </div>
    </aside>

    <div class="flex flex-col flex-1 min-w-0">
      <header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-6 shrink-0">
        <h1 class="text-lg font-semibold text-white uppercase tracking-wider">Graph-Based Attack Visualizer</h1>
        
        <div class="flex items-center gap-4">
          <button id="helpBtn" class="bg-slate-700 hover:bg-slate-600 transition px-3 py-1 rounded-lg border border-slate-600"> Help </button>
          <button id="reloadBtn" class="bg-slate-700 hover:bg-slate-600 transition px-3 py-1 rounded-lg border border-slate-600">Reload Graph</button>
          <span id="status" class="font-mono text-slate-500 uppercase"></span>
        </div>
      </header>

      <main class="flex-1 p-4 overflow-hidden">
        <div class="h-full flex gap-4">
          
          <div class="flex-1 bg-slate-800 rounded-xl shadow-lg p-2 relative border border-slate-700/50 min-w-0 min-h-0 flex flex-col">
            <div id="pathResult" class="hidden absolute top-4 left-4 z-[100] bg-slate-900/90 backdrop-blur border border-rose-500/50 px-4 py-2 rounded-lg shadow-2xl flex items-center gap-3 animate-in pulse-red">
              <div class="flex flex-col">
                <span class="text-[9px] text-slate-500 uppercase font-bold tracking-widest leading-none">Total Attack Cost</span>
                <div class="flex items-baseline gap-1 mt-1">
                  <span id="totalCostValue" class="text-2xl font-mono font-black text-rose-500">0</span>
                  <span class="text-[10px] text-rose-500/60 font-bold uppercase">Difficulty</span>
                </div>
              </div>
            </div>
            
            <div id="cy" class="flex-1 w-full"></div>
            
          </div>

          <aside id="detailCard" class="hidden w-60 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl flex flex-col shrink-0 overflow-hidden">
            <div class="p-3 bg-slate-700/30 border-b border-slate-700 flex justify-between items-center">
              <h3 id="cardTitle" class="font-bold text-white tracking-widest uppercase text-[9px]">Inspector</h3>
              <button id="closeCard" class="text-slate-400 hover:text-white p-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            
            <div id="cardContent" class="p-4 space-y-5 overflow-y-auto"></div>
            
            <div class="p-2 bg-slate-900/20 border-t border-slate-700 mt-auto text-center">
              <p class="text-[8px] text-slate-500 uppercase font-bold tracking-widest">Security Engine</p>
            </div>
          </aside>

        </div>
      </main>
    </div>
  </div>
  <!-- PROFILE CONFIG MODAL -->
<div id="profileModal" class="hidden fixed inset-0 z-[1000]">
  <!-- backdrop -->
  <div id="profileBackdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

  <!-- modal wrapper -->
  <div class="absolute inset-0 flex items-center justify-center p-4">

    <!-- modal panel-->
    <div class="w-full max-w-xl rounded-2xl border border-slate-700 bg-slate-900 text-slate-200 shadow-2xl">

      <!-- header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-700">
        <h2 class="text-base font-semibold text-white uppercase tracking-wider">Configure Your Business</h2>
      </div>

      <!-- questionnaire -->
      <div class="px-6 py-5 space-y-4 text-sm">

    <label class="flex justify-between items-center">
      <span>Uses VPN</span>
      <input type="checkbox" id="usesVPN" class="accent-emerald-500">
    </label>

    <label class="flex justify-between items-center">
      <span>Has File Server</span>
      <input type="checkbox" id="hasFileServer" class="accent-emerald-500">
    </label>

    <label class="flex justify-between items-center">
      <span>Uses SaaS</span>
      <input type="checkbox" id="usesSaaS" class="accent-emerald-500">
    </label>

    <label class="flex justify-between items-center">
      <span>Public Web App</span>
      <input type="checkbox" id="hasPublicWebApp" class="accent-emerald-500">
    </label>

    <label class="flex justify-between items-center">
      <span>Uses Identity Provider</span>
      <input type="checkbox" id="usesIdentityProvider" class="accent-emerald-500">
    </label>

  </div>

  <!-- save button -->
  <div class="px-6 py-4 border-t border-slate-700">
    <button id="saveProfileBtn"
            class="w-full bg-emerald-600 hover:bg-emerald-700 transition px-4 py-2 rounded-lg font-semibold">
      Save & Generate Graph
    </button>
  </div>

    </div>
  </div>
</div>
<div id="edgeTooltip" class="hidden"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
